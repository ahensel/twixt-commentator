# nginx reverse-proxy config for Twixt Commentator
#
# Deployment (handled by deploy.sh):
#   sudo cp /home/ubuntu/twixt-commentator/nginx/twixt-commentator.conf \
#           /etc/nginx/sites-available/twixt-commentator
#   sudo ln -sf /etc/nginx/sites-available/twixt-commentator \
#               /etc/nginx/sites-enabled/twixt-commentator
#   sudo nginx -t && sudo systemctl reload nginx
#
# Future SSL — after DNS is pointed at this server, run once:
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d twixtcommentator.com -d www.twixtcommentator.com
# Certbot will rewrite this file to add the 443 block and the 80→443 redirect.

server {
    server_name twixt-commentator.duckdns.org;

    # Pass all traffic to the Node.js app
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Required for WebSocket support (if ever needed)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Let Express see the real client IP and protocol
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/twixt-commentator.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/twixt-commentator.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = twixt-commentator.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name twixt-commentator.duckdns.org;
    return 404; # managed by Certbot


}